<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Casamento G | W por Motion Films</title>
<link rel="icon" href="img/favicon.jpg" type="image/jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --espresso:#2e1f17;
  --mocha:#5a3e2e;
  --ribbon:#6b4a36;
  --ribbon-hi:#8d6a51;
  --ribbon-lo:#43301f;
  --sand:#d9c6aa;
  --paper:#e6d3b8;
  --ivory:#fbf8f2;
  --white:#ffffff;
  --serif:"Fraunces", Georgia, "Times New Roman", serif;
  --sans:"Jost", "Helvetica Neue", Arial, sans-serif;
  --ease:cubic-bezier(.72,0,.18,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);
  color:var(--espresso);
  background:var(--ivory);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
body.done{overflow:auto}

/* ---------- Conteúdo revelado (fica atrás do papel) ---------- */
.reveal{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(14px,3vh,28px);
  padding:clamp(20px,4vw,56px);
  padding-top:max(clamp(20px,4vw,56px), env(safe-area-inset-top, 0px));
  padding-bottom:max(clamp(20px,4vw,56px), env(safe-area-inset-bottom, 0px));
  background:
    radial-gradient(ellipse at 50% 0%, var(--white) 0%, var(--ivory) 45%, #f1e8d8 100%);
  opacity:0;
  transform:scale(.97);
  transition:opacity 1.2s ease, transform 1.8s var(--ease);
}
.open .reveal{opacity:1;transform:none}
.reveal h2{
  font-family:var(--serif);font-weight:300;
  font-size:clamp(1.6rem,3.6vw,2.8rem);
  line-height:1.15;text-align:center;letter-spacing:-.01em;
  color:var(--espresso);
}
.reveal .msg{
  max-width:52ch;text-align:center;
  font-weight:300;line-height:1.6;color:var(--mocha);
  font-size:clamp(.95rem,1.6vw,1.1rem);
}
.player{
  width:min(1000px,100%);
  aspect-ratio:16/9;
  background:var(--espresso);
  border-radius:4px;
  overflow:hidden;
  box-shadow:0 30px 60px -28px rgba(46,31,23,.55), 0 0 0 10px var(--white), 0 0 0 11px var(--sand);
  margin:11px 0;
}
.player video,.player iframe{width:100%;height:100%;display:block;border:0;background:#000}
.actions{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}
.btn{
  font:500 .95rem var(--sans);
  letter-spacing:.02em;
  text-decoration:none;
  color:var(--ivory);background:var(--mocha);
  padding:.85em 1.8em;border-radius:999px;
  transition:background .25s;
}
.btn:hover{background:var(--espresso)}
.brand{font-family:var(--serif);font-weight:300;font-size:.95rem;color:var(--mocha);letter-spacing:.04em}
.btn:focus-visible,.bow:focus-visible{outline:3px solid var(--mocha);outline-offset:4px}

/* ---------- Embrulho ---------- */
.wrap{position:fixed;inset:0;z-index:5;pointer-events:none}
.wrap.live{pointer-events:auto}
.half{
  position:absolute;top:0;bottom:0;width:50%;
  background-color:var(--paper);
  background-image:
    repeating-linear-gradient(45deg, rgba(255,255,255,.07) 0 2px, transparent 2px 7px),
    repeating-linear-gradient(-45deg, rgba(90,62,46,.04) 0 2px, transparent 2px 7px);
  transition:transform 1.7s var(--ease);
  will-change:transform;
}
.half.l{left:0;box-shadow:inset -40px 0 60px -40px rgba(90,62,46,.28)}
.half.r{right:0;box-shadow:inset 40px 0 60px -40px rgba(90,62,46,.28)}
.open .half.l{transform:translateX(-102%);box-shadow:20px 0 60px rgba(46,31,23,.3)}
.open .half.r{transform:translateX(102%);box-shadow:-20px 0 60px rgba(46,31,23,.3)}

/* fitas: acompanham cada metade do papel */
.rib-h{
  position:absolute;left:0;right:0;top:50%;height:76px;transform:translateY(-50%);
  background:linear-gradient(180deg,var(--ribbon-lo) 0%,var(--ribbon) 22%,var(--ribbon-hi) 50%,var(--ribbon) 78%,var(--ribbon-lo) 100%);
  box-shadow:0 6px 14px -6px rgba(46,31,23,.5);
}
.rib-v{
  position:absolute;top:0;bottom:0;width:38px;
  background:linear-gradient(90deg,var(--ribbon-lo),var(--ribbon) 30%,var(--ribbon-hi) 55%,var(--ribbon) 80%,var(--ribbon-lo));
}
.half.l .rib-v{right:0}
.half.r .rib-v{left:0}
.half.l .rib-v{background:linear-gradient(90deg,var(--ribbon-lo),var(--ribbon) 30%,var(--ribbon-hi) 70%,var(--ribbon))}
.half.r .rib-v{background:linear-gradient(90deg,var(--ribbon),var(--ribbon-hi) 30%,var(--ribbon) 70%,var(--ribbon-lo))}

/* textos sobre o papel */
.label{
  position:absolute;left:50%;transform:translateX(-50%);
  text-align:center;width:min(90vw,520px);
  transition:opacity .6s ease;
}
.label.top{top:max(11vh, env(safe-area-inset-top, 0px))}
.label.top small{display:block;font-weight:300;font-size:1rem;color:var(--mocha);margin-bottom:.4em}
.label.top strong{font:300 clamp(1.8rem,5vw,3rem)/1.1 var(--serif);color:var(--espresso)}
.label.bottom{bottom:max(11vh, env(safe-area-inset-bottom, 0px));font-weight:400;color:var(--mocha);font-size:1rem}
.untie .label{opacity:0}

/* laço */
.bow{
  position:absolute;left:50%;top:50%;
  width:clamp(170px,30vw,270px);
  transform:translate(-50%,-52%);
  background:none;border:0;cursor:pointer;
  filter:drop-shadow(0 10px 12px rgba(46,31,23,.35));
  -webkit-tap-highlight-color:transparent;
}
.bow svg{display:block;width:100%;height:auto;overflow:visible}
.bow svg *{transform-box:fill-box;transform-origin:center;transition:transform .9s var(--ease), opacity .7s ease}
.bow svg .loop-l{transform-origin:100% 80%}
.bow svg .loop-r{transform-origin:0% 80%}
.bow svg .tail-l,.bow svg .tail-r{transform-origin:50% 0%}
.bow:not(.go){animation:pulse 2.8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:translate(-50%,-52%) scale(1)}50%{transform:translate(-50%,-52%) scale(1.045)}}

.untie .bow{animation:none}
.untie .bow .loop-l{transform:rotate(-38deg) scale(.15);opacity:0}
.untie .bow .loop-r{transform:rotate(38deg) scale(.15);opacity:0}
.untie .bow .tail-l{transform:translateY(60px) rotate(22deg);opacity:0;transition-delay:.12s}
.untie .bow .tail-r{transform:translateY(60px) rotate(-22deg);opacity:0;transition-delay:.12s}
.untie .bow .knot{transform:scale(0);opacity:0;transition-delay:.5s}
.untie .bow{pointer-events:none}
.open .bow{display:none}

.wrap.gone{display:none}

@media (prefers-reduced-motion:reduce){
  .half,.reveal{transition-duration:.01s}
  .bow:not(.go){animation:none}
  .bow svg *{transition-duration:.01s}
}
@media (max-width:600px){
  .rib-h{height:60px}
  .rib-v{width:30px}
}
</style>
</head>
<body>

<main class="reveal" id="reveal">
  <h2 id="title"></h2>
  <p class="msg" id="message"></p>
  <div class="player" id="player"></div>
  <div class="actions" id="actions"></div>
  <p class="brand" id="brand"></p>
</main>

<div class="wrap live" id="wrap">
  <div class="half l"><div class="rib-h"></div><div class="rib-v"></div></div>
  <div class="half r"><div class="rib-h"></div><div class="rib-v"></div></div>

  <div class="label top"><small>Preparado com cuidado para</small><strong id="client"></strong></div>

  <button class="bow" id="bow" aria-label="Desembrulhar e assistir ao vídeo">
    <svg viewBox="0 0 240 200" aria-hidden="true">
      <defs>
        <linearGradient id="gLoop" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#8d6a51"/><stop offset=".55" stop-color="#6b4a36"/><stop offset="1" stop-color="#43301f"/>
        </linearGradient>
        <linearGradient id="gTail" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#43301f"/><stop offset=".5" stop-color="#7a5740"/><stop offset="1" stop-color="#5a3e2e"/>
        </linearGradient>
        <radialGradient id="gKnot" cx=".4" cy=".35" r=".8">
          <stop offset="0" stop-color="#9a775c"/><stop offset="1" stop-color="#4a3322"/>
        </radialGradient>
      </defs>
      <path class="tail-l" d="M112 104 L58 190 L80 180 L92 194 L128 110 Z" fill="url(#gTail)"/>
      <path class="tail-r" d="M128 104 L182 190 L160 180 L148 194 L112 110 Z" fill="url(#gTail)"/>
      <g class="loop-l">
        <path d="M120 92 C70 18 6 30 14 84 C20 128 82 120 120 102 Z" fill="url(#gLoop)"/>
        <path d="M112 94 C74 40 36 48 40 82 C44 108 80 106 112 98" fill="none" stroke="#a98466" stroke-opacity=".55" stroke-width="2"/>
      </g>
      <g class="loop-r">
        <path d="M120 92 C170 18 234 30 226 84 C220 128 158 120 120 102 Z" fill="url(#gLoop)"/>
        <path d="M128 94 C166 40 204 48 200 82 C196 108 160 106 128 98" fill="none" stroke="#a98466" stroke-opacity=".55" stroke-width="2"/>
      </g>
      <rect class="knot" x="100" y="81" width="40" height="36" rx="13" fill="url(#gKnot)"/>
    </svg>
  </button>

  <p class="label bottom">Toque no laço para desembrulhar</p>
</div>

<script>
/* =====================  CONFIGURE AQUI  ===================== */
const CONFIG = {
  brand:   "Por Next Ascend",
  client:  "Motion Films",
  title:   "Casamento G | W por Motion Films",
  message: "Foi um prazer criar este material para você. Assista com calma e, se quiser ajustar algo, pode nos chamar.",
  // Arquivo de vídeo (.mp4 recomendado), ou link do YouTube / Vimeo
  video:   "https://youtu.be/O3Ov-rMz390",
  poster:  "img/capa-video.jpg",        // opcional: imagem de capa, ex.: "capa.jpg"
  download: true      // mostra o botão de baixar (só para arquivo de vídeo)
};
/* ============================================================ */

const $ = id => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

document.title = `${CONFIG.title} · ${CONFIG.brand}`;
$("title").textContent = CONFIG.title;
$("message").textContent = CONFIG.message;
$("brand").textContent = CONFIG.brand;
$("client").textContent = CONFIG.client;

/* Player: arquivo local ou embed */
const isFile = /\.(mp4|webm|mov|m4v)(\?.*)?$/i.test(CONFIG.video);
let videoEl = null;

function toEmbed(url){
  let m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);
  if (m) return `https://www.youtube.com/embed/${m[1]}?rel=0&modestbranding=1`;
  m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if (m) return `https://player.vimeo.com/video/${m[1]}`;
  return url;
}

if (isFile){
  videoEl = document.createElement("video");
  videoEl.controls = true;
  videoEl.playsInline = true;
  videoEl.preload = "metadata";
  if (CONFIG.poster) videoEl.poster = CONFIG.poster;
  videoEl.src = CONFIG.video;
  $("player").appendChild(videoEl);
  if (CONFIG.download){
    const a = document.createElement("a");
    a.className = "btn";
    a.href = CONFIG.video;
    a.download = "";
    a.textContent = "Baixar vídeo";
    $("actions").appendChild(a);
  }
} else {
  const f = document.createElement("iframe");
  f.src = toEmbed(CONFIG.video);
  f.title = "Vídeo";
  f.allow = "accelerometer; autoplay; encrypted-media; fullscreen; picture-in-picture";
  f.allowFullscreen = true;
  $("player").appendChild(f);
}

const videoBaixar = document.createElement("a");
videoBaixar.className = "btn";
videoBaixar.href = "https://drive.google.com/drive/folders/10necgmo9j5zSf1VtrtCXSPQa--HWkXTz?usp=drive_link";
videoBaixar.target = "_blank";
videoBaixar.rel = "noopener";
videoBaixar.textContent = "Baixar vídeo";
$("actions").appendChild(videoBaixar);

/* Abertura: laço desfaz → papel se abre → vídeo aparece */
const stage = document.body;
function unwrap(){
  $("bow").classList.add("go");
  stage.classList.add("untie");

  setTimeout(() => stage.classList.add("open"), reduce ? 100 : 1300);

  setTimeout(() => {
    if (videoEl) videoEl.play().catch(() => {});   // se o navegador bloquear, o cliente aperta play
  }, reduce ? 400 : 2400);

  setTimeout(() => {
    $("wrap").classList.add("gone");
    stage.classList.add("done");
  }, reduce ? 500 : 3100);
}
$("bow").addEventListener("click", unwrap, { once: true });
</script>
</body>
</html>
